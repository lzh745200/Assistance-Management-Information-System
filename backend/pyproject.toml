# 覆盖率配置
# 注意：pytest 配置已统一在 pytest.ini 中，避免配置冲突警告
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 100  # 100% 覆盖率门禁（可覆盖集：pragma 豁免真正不可执行的行）

exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "# pragma: no cover",
    "\\.\\.\",  # Ellipsis in stubs",
]

[tool.coverage.html]
directory = "htmlcov"
